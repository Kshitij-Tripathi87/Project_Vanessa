name: Android foundation

on:
  push:
    branches:
      - main
    paths:
      - 'apps/android/**'
      - 'scripts/fetch-llama-cpp.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'scripts/fetch-llama-cpp.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The emulator journeys are slow, so catch typo'd selectors and UI that is
      # declared but never composed here instead of 20 minutes into the UI QA job.
      - name: Check instrumented UI selectors match rendered semantics
        run: node scripts/check-android-ui-contract.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 used to request Google's removed "tools" SDK package and failed
      # before Gradle started. v4 no longer installs that obsolete package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install pinned Android SDK components
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A plain assembleDebug can silently produce an APK without llama.cpp.
      # Fetch the exact pinned source revision and make the APK gate require
      # both native libraries before CI will publish the artifact.
      - name: Fetch pinned llama.cpp source
        run: bash scripts/fetch-llama-cpp.sh

      - name: Test Android modules and build verified native APK
        working-directory: apps/android
        run: |
          # Failure here used to surface as "Process completed with exit code 1"
          # and nothing else, because the Gradle output never left the runner.
          # `|| status=$?` keeps the shell from aborting before the diagnosis,
          # and every substitution carries `|| true` so a non-matching grep
          # cannot abort the diagnostic itself.
          status=0
          ./gradlew \
            :core:protocol:test \
            :core:agent:test \
            :app:testDebugUnitTest \
            :app:verifyLocalInferenceApk \
            --no-daemon \
            -PllamaCppDir="${GITHUB_WORKSPACE}/.toolchain/llama.cpp" \
            > /tmp/android-gradle.log 2>&1 || status=$?
          tail -n 40 /tmp/android-gradle.log || true
          if [ $status -ne 0 ]; then
            # `e:` lines are Kotlin compile errors; the JUnit failure lines are
            # what a red unit test looks like.
            excerpt=$(grep -nE "^e: |error:|FAILURE:|Execution failed|Caused by|There were failing tests|> Task .* FAILED" -A 2 /tmp/android-gradle.log | tail -c 2500 | tr '\n' '~' || true)
            echo "::error::Gradle exited ${status}: ${excerpt:-no matching lines}"
            exit $status
          fi

      - name: Verify biometric approval uses the Keystore CryptoObject
        run: |
          python - <<'PY'
          from pathlib import Path

          store = Path("apps/android/app/src/main/java/com/vanessa/mobile/identity/AndroidRemoteApprovalKeyStore.kt").read_text()
          activity = Path("apps/android/app/src/main/java/com/vanessa/mobile/ui/RemoteControlActivity.kt").read_text()
          assert "BiometricPrompt.CryptoObject(signature)" in store
          callback_start = store.index("override fun onAuthenticationSucceeded")
          returned_signature = store.index("result.cryptoObject?.signature", callback_start)
          assert returned_signature > callback_start
          assert "result.cryptoObject?.signature" not in activity
          assert "authenticatedSignature.update(" in activity
          assert "authenticatedSignature.sign()" in activity
          print("Biometric approval is cryptographically bound to the Android Keystore CryptoObject.")
          PY

      - name: Upload verified development APK
        uses: actions/upload-artifact@v4
        with:
          name: vanessa-android-debug-arm64
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

