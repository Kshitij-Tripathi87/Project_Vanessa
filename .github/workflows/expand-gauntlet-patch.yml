name: Expand Vanessa Gauntlet patch

on:
  push:
    branches:
      - feat/vanessa-gauntlet-l1
    paths:
      - .github/workflows/expand-gauntlet-patch.yml

permissions:
  contents: write

concurrency:
  group: expand-vanessa-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expand-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the benchmark branch
        uses: actions/checkout@v4
        with:
          ref: feat/vanessa-gauntlet-l1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and expand the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc evals/vanessa-gauntlet/artifacts/Vanessa_Gauntlet_L1.patch.gz > /tmp/Vanessa_Gauntlet_L1.patch
          git apply --check /tmp/Vanessa_Gauntlet_L1.patch
          git apply /tmp/Vanessa_Gauntlet_L1.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("evals/vanessa-gauntlet/tests/runner.test.mjs")
          source = path.read_text()
          old = "  const summary = JSON.parse(await readFile(path.join(batchRoot, batchIds[0], 'summary.json'), 'utf8'));"
          new = """  const summaryPath = path.join(batchRoot, batchIds[0] ?? "", 'summary.json');
          let summary;
          try {
            summary = JSON.parse(await readFile(summaryPath, 'utf8'));
          } catch (error) {
            const batchEntries = await import('node:fs/promises').then((fs) => fs.readdir(batchRoot, { withFileTypes: true }));
            throw new Error("Runner omitted summary.json. exit=" + result.status + "; signal=" + result.signal + "; error=" + result.error + "; stdout=" + result.stdout + "; stderr=" + result.stderr + "; entries=" + batchEntries.map((entry) => entry.name).join(", "), { cause: error });
          }"""
          if old not in source:
              raise SystemExit("Could not locate runner.test.mjs summary read block")
          path.write_text(source.replace(old, new))
          runner = Path("evals/vanessa-gauntlet/run.mjs")
          runner_source = runner.read_text()
          old_copy = """  await mkdir(workspaceDir, { recursive: false });
          await cp(pack.templatePath, workspaceDir, { recursive: true, errorOnExist: true, force: false });"""
          new_copy = """  await cp(pack.templatePath, workspaceDir, { recursive: true, errorOnExist: true, force: false });"""
          if old_copy not in runner_source:
              raise SystemExit("Could not locate workspace pre-creation/copy sequence")
          runner.write_text(runner_source.replace(old_copy, new_copy))
          PY
          node --test evals/vanessa-gauntlet/tests/*.test.mjs
          rm .github/workflows/expand-gauntlet-patch.yml
          git add -A evals/vanessa-gauntlet IMPLEMENTATION_STATUS.md RESULTS_SUMMARY.json .github/workflows/expand-gauntlet-patch.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat(eval): expand Vanessa Gauntlet L1 benchmark source"
          git push origin HEAD:feat/vanessa-gauntlet-l1
