name: iOS foundation

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'packages/protocol/fixtures/conversation-reducer-vectors-v1.json'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'packages/protocol/fixtures/conversation-reducer-vectors-v1.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require an Xcode SDK with Foundation Models
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo '::error::Xcode with the iOS 26 SDK is required to compile the on-device Foundation Models path.'
            exit 1
          fi
      - name: Test shared conversation reducer fixtures
        run: swift test --package-path apps/ios
      - name: Build unsigned iPhone simulator app
        run: >-
          xcodebuild -project apps/ios/Vanessa.xcodeproj -scheme Vanessa
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
