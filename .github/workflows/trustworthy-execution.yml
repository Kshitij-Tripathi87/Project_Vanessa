name: Trustworthy Execution

on:
  push:
    branches: [Vanessa-Prototype-1-MAIN]
    paths:
      - "services/orchestrator/**"
      - "packages/shared/**"
      - "packages/incident-lab/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/trustworthy-execution.yml"
  pull_request:
    branches: [Vanessa-Prototype-1-MAIN]
    paths:
      - "services/orchestrator/**"
      - "packages/shared/**"
      - "packages/incident-lab/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/trustworthy-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trustworthy-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trustworthy-execution:
    name: Trust contract / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @vanessa/shared build

      - name: Type-check orchestrator
        run: pnpm --filter @vanessa/orchestrator build

      - name: Run trustworthy execution acceptance tests
        run: pnpm --filter @vanessa/orchestrator exec tsx --test src/tests/trustworthyExecution.test.ts

      - name: Run deterministic incident contract gate
        run: pnpm --filter @vanessa/orchestrator exec tsx --test src/tests/checkoutIncidentGate.test.ts
