name: Windows installer
on:
  push:
    branches: [Vanessa-Prototype-1-MAIN]
    tags: ['v*']
  pull_request:
    branches: [Vanessa-Prototype-1-MAIN]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    name: Build and test Windows Setup EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Test launcher and diagnostics
        run: |
          pnpm run test:launcher
          pnpm run test:doctor
      - name: Test desktop layout and microphone diagnostics
        run: |
          pnpm run test:desktop:layout
          pnpm run test:desktop:microphone
      - name: Test voice provider contracts
        run: pnpm run test:sarvam:gate
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer EXE and MSI
        run: pnpm run package:windows-msi
      - name: Sign installer (required for version-tag releases)
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $requireSignature = $env:GITHUB_REF -like 'refs/tags/v*'
          ./scripts/sign-windows-installer.ps1 -InstallerPath 'artifacts/windows-installer/Vanessa-Setup-x64.exe' -RequireSignature:$requireSignature
          ./scripts/sign-windows-installer.ps1 -InstallerPath 'artifacts/windows-installer/Vanessa-Setup-x64.msi' -RequireSignature:$requireSignature
      - name: EXE install and uninstall smoke test
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -InstallerPath 'artifacts/windows-installer/Vanessa-Setup-x64.exe'
      - name: MSI install and uninstall smoke test
        shell: pwsh
        run: ./scripts/test-windows-msi.ps1 -MsiPath 'artifacts/windows-installer/Vanessa-Setup-x64.msi'
      - name: Upload installer and bootstrap ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Vanessa-Windows-Installers-${{ github.sha }}
          path: |
            artifacts/windows-installer/Vanessa-Setup-x64.exe
            artifacts/windows-installer/Vanessa-Setup-x64.msi
            artifacts/windows/Vanessa-Windows-Bootstrap-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish installer for version tags
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/Vanessa-Setup-x64.exe
            artifacts/windows-installer/Vanessa-Setup-x64.msi
            artifacts/windows/Vanessa-Windows-Bootstrap-*.zip
          generate_release_notes: true
