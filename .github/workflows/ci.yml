name: Agent Workflow CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-workflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Desktop imports @vanessa/protocol from its generated dist entry point.
      # Building only @vanessa/shared left this workspace package unbuilt and made
      # the desktop TypeScript build fail with TS2307 on clean CI runners.
      - name: Build canonical phone-PC protocol
        run: pnpm --filter @vanessa/protocol build

      - name: Test canonical phone-PC protocol
        run: pnpm --filter @vanessa/protocol test

      - name: Build shared contracts
        run: pnpm --filter @vanessa/shared build

      - name: Verify protocol contract and generated schema
        run: |
          pnpm --filter @vanessa/shared protocol:export
          git diff --exit-code -- packages/shared/schema/protocol-v1.schema.json
          pnpm --filter @vanessa/shared test:protocol

      - name: Validate fixed router evaluation set
        run: pnpm --filter @vanessa/orchestrator exec tsx ../../eval/router-eval.ts ../../eval/router-v1.jsonl

      - name: Build orchestrator
        run: pnpm --filter @vanessa/orchestrator build

      - name: Build voice agent
        run: pnpm --filter @vanessa/voice-agent build

      - name: Run full voice-agent test suite
        run: |
          pnpm --filter @vanessa/voice-agent test
          pnpm --filter @vanessa/voice-agent exec tsx --import ../../scripts/test-env.mjs --test src/tests/*.test.ts src/session/wakeWord.test.ts

      - name: Start voice agent and exercise sandbox ASR-to-TTS loop
        run: pnpm --filter @vanessa/voice-agent exec tsx --test src/tests/voiceServerSandbox.test.ts

      - name: Set up Python for local Whisper support tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Python voice support and syntax
        run: |
          python -m unittest discover -s services/voice-agent/tests -v
          python -m py_compile services/voice-agent/voice_server.py services/voice-agent/transcript_logging.py services/voice-agent/test_voice_loop.py

      - name: Build desktop renderer and Electron main process
        run: pnpm --filter @vanessa/desktop build

      - name: Test desktop docking and preference persistence
        run: pnpm --filter @vanessa/orchestrator exec tsx --test ../../apps/desktop/src/main/docking.test.ts

      - name: Test local wake-word routing and PCM framing
        run: pnpm --filter @vanessa/voice-agent exec tsx --test src/session/wakeWord.test.ts

      - name: Test deterministic agent workflows
        run: pnpm --filter @vanessa/orchestrator exec tsx --test src/tests/agentRouting.test.ts

      - name: Test browser and Windows routing contracts
        run: pnpm --filter @vanessa/orchestrator exec tsx --test src/tests/planner.browser.test.ts

      - name: Test Windows action failure handling and verification
        run: pnpm --filter @vanessa/orchestrator exec tsx --test src/tests/windowsAgentUiAutomation.test.ts src/tests/windowsControls.test.ts src/tests/windowsUiAutomation.test.ts

      - name: Test task outcome and verification semantics
        run: pnpm --filter @vanessa/orchestrator exec tsx --test src/tests/taskRunner.result.test.ts

      - name: Test reviewed agent catalog
        run: pnpm --filter @vanessa/orchestrator exec tsx --test src/tests/agentCatalog.test.ts

      - name: Test shared voice/text command contract
        run: pnpm --filter @vanessa/voice-agent exec tsx --test src/tests/commandContract.test.ts

      - name: Regression-test existing coding handoff
        run: pnpm --filter @vanessa/orchestrator test:codex
