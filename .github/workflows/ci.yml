name: Agent Workflow CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-workflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @vanessa/shared build

      - name: Build orchestrator
        run: pnpm --filter @vanessa/orchestrator build

      - name: Build voice agent
        run: pnpm --filter @vanessa/voice-agent build

      - name: Build desktop renderer and Electron main process
        run: pnpm --filter @vanessa/desktop build

      - name: Test desktop docking and preference persistence
        run: pnpm --filter @vanessa/desktop test:docking

      - name: Test local wake-word routing and PCM framing
        run: pnpm --filter @vanessa/voice-agent test:wake-word

      - name: Test deterministic agent workflows
        run: pnpm --filter @vanessa/orchestrator test:agent-routing

      - name: Test reviewed agent catalog
        run: pnpm --filter @vanessa/orchestrator exec tsx --test src/tests/agentCatalog.test.ts

      - name: Test shared voice/text command contract
        run: pnpm --filter @vanessa/voice-agent test:contract

      - name: Regression-test existing coding handoff
        run: pnpm --filter @vanessa/orchestrator test:codex

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @vanessa/shared build

      - name: Build backend services
        shell: pwsh
        run: |
          pnpm --filter @vanessa/orchestrator build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @vanessa/voice-agent build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy production-only service runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/runtime | Out-Null
          pnpm --filter @vanessa/orchestrator deploy --prod apps/desktop/runtime/orchestrator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @vanessa/voice-agent deploy --prod apps/desktop/runtime/voice-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse -Force skills apps/desktop/runtime/skills
          Copy-Item -Recurse -Force config apps/desktop/runtime/config
          Copy-Item -Force .env.example apps/desktop/runtime/vanessa.env.example
          $nodeExe = (node -e "process.stdout.write(process.execPath)").Trim()
          Copy-Item -Force $nodeExe apps/desktop/runtime/node.exe
          $package = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          @{
            buildId = "${{ github.sha }}"
            version = $package.version
            sourceRef = "${{ github.ref }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8 apps/desktop/runtime/build-meta.json
          if (!(Test-Path apps/desktop/runtime/orchestrator/dist/server.js)) { throw "Orchestrator deploy output is missing." }
          if (!(Test-Path apps/desktop/runtime/voice-agent/dist/server.js)) { throw "Voice agent deploy output is missing." }
          if (!(Test-Path apps/desktop/runtime/node.exe)) { throw "Bundled Node.js runtime is missing." }

      - name: Build desktop application
        run: pnpm --filter @vanessa/desktop build

      - name: Test dock preferences in packaged build output
        run: pnpm --filter @vanessa/desktop test:docking

      - name: Build Windows NSIS installer
        run: pnpm --filter @vanessa/desktop build:installer

      - name: Upload installable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Vanessa-Windows-PR-${{ github.event.pull_request.number || github.run_number }}
          path: apps/desktop/dist/installers/*.exe
          if-no-files-found: error
          retention-days: 14
