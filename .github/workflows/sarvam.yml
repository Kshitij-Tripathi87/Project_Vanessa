name: Sarvam deterministic acceptance
on:
  push:
    branches: [Vanessa-Prototype-1-MAIN]
  pull_request:
    branches: [Vanessa-Prototype-1-MAIN]
permissions:
  contents: read
jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SARVAM_API_KEY: vanessa-build-secret-canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Type-check evaluation harness
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm run test:sarvam:gate
      - run: pnpm --filter @vanessa/orchestrator test:it-ops-log-target
      - run: node --test scripts/security.test.cjs
      # No real microphone, cloud credentials, or billable provider calls in CI.
