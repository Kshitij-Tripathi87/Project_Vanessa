name: Voice pipeline contract

on:
  pull_request:
    paths:
      - "services/voice-agent/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/voice-pipeline-contracts.yml"
  push:
    branches:
      - "feature/voice-e2e-pipeline-gates"
      - "feature/voice-turn-recovery-tests"
    paths:
      - "services/voice-agent/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/voice-pipeline-contracts.yml"

permissions:
  contents: read

jobs:
  voice-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @vanessa/shared build

      - name: Type-check voice service
        run: pnpm --filter @vanessa/voice-agent build

      - name: Test voice capture/ASR contracts
        run: pnpm --filter @vanessa/voice-agent test

      - name: Test voice behavior contracts
        run: pnpm --filter @vanessa/voice-agent test:behavior

      - name: Test voice-to-orchestrator-to-TTS loop
        run: pnpm test:voice:pipeline