name: Desktop Windows Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after building the installer
        type: boolean
        default: false
        required: true
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  # PR builds are SHA-scoped so a stuck older smoke test cannot block current fixes.
  # Release/tag runs remain serialized by ref.
  group: desktop-release-${{ github.event_name == 'pull_request' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @vanessa/shared build

      - name: Build backend services
        shell: pwsh
        run: |
          pnpm --filter @vanessa/orchestrator build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @vanessa/voice-agent build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create isolated production runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/runtime | Out-Null
          pnpm --filter @vanessa/orchestrator deploy --prod apps/desktop/runtime/orchestrator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @vanessa/voice-agent deploy --prod apps/desktop/runtime/voice-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse -Force skills apps/desktop/runtime/skills
          Copy-Item -Recurse -Force config apps/desktop/runtime/config
          Copy-Item -Force .env.example apps/desktop/runtime/vanessa.env.example
          $nodeExe = (node -e "process.stdout.write(process.execPath)").Trim()
          Copy-Item -Force $nodeExe apps/desktop/runtime/node.exe
          $package = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          @{
            buildId = "${{ github.sha }}"
            version = $package.version
            sourceRef = "${{ github.ref }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8 apps/desktop/runtime/build-meta.json
          if (!(Test-Path apps/desktop/runtime/orchestrator/dist/server.js)) { throw "Orchestrator deploy output is missing." }
          if (!(Test-Path apps/desktop/runtime/voice-agent/dist/server.js)) { throw "Voice agent deploy output is missing." }
          if (!(Test-Path apps/desktop/runtime/node.exe)) { throw "Bundled Node.js runtime is missing." }

      - name: Smoke-test deployed production package dependency graphs
        shell: pwsh
        run: |
          $nodeExe = (Resolve-Path "apps/desktop/runtime/node.exe").Path
          Push-Location "apps/desktop/runtime/orchestrator"
          try {
            & $nodeExe --input-type=module -e "await import('fastify'); await import('playwright'); console.log('Orchestrator production dependencies resolve.')"
            if ($LASTEXITCODE -ne 0) { throw "Orchestrator production dependency smoke test failed." }
          } finally {
            Pop-Location
          }

          Push-Location "apps/desktop/runtime/voice-agent"
          try {
            & $nodeExe --input-type=module -e "await import('fastify'); console.log('Voice-agent production dependencies resolve.')"
            if ($LASTEXITCODE -ne 0) { throw "Voice-agent production dependency smoke test failed." }
          } finally {
            Pop-Location
          }

      - name: Build renderer and Electron desktop process
        run: pnpm --filter @vanessa/desktop build

      - name: Package the Windows installer
        run: pnpm --filter @vanessa/desktop build:installer

      - name: Install Windows setup and smoke-test installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "apps/desktop/dist/installers" -Filter "Vanessa Setup *.exe" | Select-Object -First 1
          if (!$installer) {
            Get-ChildItem "apps/desktop/dist/installers" -Force | Format-Table Name, FullName
            throw "The NSIS Vanessa Setup installer was not produced."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "VanessaSmokeInstall"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -PassThru
          if (!$install.WaitForExit(300000)) {
            Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
            throw "NSIS installer did not exit within 300 seconds."
          }
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)."
          }

          $requiredFiles = @(
            (Join-Path $installDir "Vanessa.exe"),
            (Join-Path $installDir "resources\app.asar"),
            (Join-Path $installDir "resources\runtime\build-meta.json"),
            (Join-Path $installDir "resources\runtime\node.exe"),
            (Join-Path $installDir "resources\runtime\orchestrator\dist\server.js"),
            (Join-Path $installDir "resources\runtime\voice-agent\dist\server.js")
          )
          $missingFiles = @($requiredFiles | Where-Object { !(Test-Path $_) })
          if ($missingFiles.Count -gt 0) {
            Write-Host "Missing installed files:"
            $missingFiles | ForEach-Object { Write-Host " - $_" }
            Get-ChildItem $installDir -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -First 100 FullName | Format-Table
            throw "NSIS installation exited successfully but the installed Vanessa payload is incomplete."
          }

          $appPath = Join-Path $installDir "Vanessa.exe"
          $appStdout = Join-Path $env:RUNNER_TEMP "vanessa-main.stdout.log"
          $appStderr = Join-Path $env:RUNNER_TEMP "vanessa-main.stderr.log"
          $app = $null
          $orchestratorHealthy = $false
          $voiceHealthy = $false
          try {
            $app = Start-Process -FilePath $appPath -PassThru -RedirectStandardOutput $appStdout -RedirectStandardError $appStderr
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while ([DateTime]::UtcNow -lt $deadline) {
              if (!$orchestratorHealthy) {
                try {
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:4139/health" -TimeoutSec 2
                  $orchestratorHealthy = $health.service -eq "vanessa-orchestrator"
                } catch {}
              }
              if (!$voiceHealthy) {
                try {
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:4500/health" -TimeoutSec 2
                  $voiceHealthy = $health.service -eq "vanessa-voice-agent"
                } catch {}
              }
              if ($orchestratorHealthy -and $voiceHealthy) { break }
              if ($app.HasExited) { throw "Installed Vanessa exited before its local services became healthy (exit code $($app.ExitCode))." }
              Start-Sleep -Seconds 1
            }

            if (!$orchestratorHealthy -or !$voiceHealthy) {
              Write-Host "=== Installed app stdout ==="
              if (Test-Path $appStdout) { Get-Content $appStdout -Tail 200 }
              Write-Host "=== Installed app stderr ==="
              if (Test-Path $appStderr) { Get-Content $appStderr -Tail 200 }
              Write-Host "=== Vanessa service logs (credentials excluded) ==="
              $vanessaDirs = @()
              foreach ($root in @($env:APPDATA, $env:LOCALAPPDATA)) {
                if (Test-Path $root) {
                  $vanessaDirs += Get-ChildItem -Path $root -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "Vanessa" }
                }
              }
              foreach ($directory in $vanessaDirs) {
                $logs = Get-ChildItem -Path $directory.FullName -Filter "*.log" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @("orchestrator.log", "voice-agent.log") }
                foreach ($log in $logs) {
                  Write-Host "--- $($log.FullName) ---"
                  Get-Content $log.FullName -Tail 200
                }
              }
              Write-Host "=== Packaged runtime metadata ==="
              $metaPath = Join-Path $installDir "resources\runtime\build-meta.json"
              if (Test-Path $metaPath) { Get-Content $metaPath }
              if (!$orchestratorHealthy) { throw "Installed orchestrator did not become healthy on 127.0.0.1:4139." }
              throw "Installed voice agent did not become healthy on 127.0.0.1:4500."
            }
            Write-Host "NSIS install completed, installed app launched, and both backend health checks passed."
          } finally {
            if ($app -and !$app.HasExited) {
              & taskkill.exe /F /T /PID $app.Id | Out-Null
            }
            $runtimeProcesses = Get-CimInstance Win32_Process | Where-Object {
              $_.Name -eq "node.exe" -and $_.CommandLine -match "[\\/]runtime[\\/](orchestrator|voice-agent)[\\/]"
            }
            foreach ($runtimeProcess in $runtimeProcesses) {
              Stop-Process -Id $runtimeProcess.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vanessa-Windows-${{ github.event.pull_request.number || github.ref_name }}
          path: apps/desktop/dist/installers/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          name: Vanessa ${{ github.ref_name }}
          generate_release_notes: true
          files: apps/desktop/dist/installers/*.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
