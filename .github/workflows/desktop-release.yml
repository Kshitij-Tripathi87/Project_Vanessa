name: Desktop Windows Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after building and testing the Windows installer
        type: boolean
        default: false
        required: true
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'pull_request' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python for bootstrap packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build

      - name: Test intelligence foundation on Windows
        run: pnpm --filter @vanessa/orchestrator test:intelligence

      - name: Parse Tailscale-only Windows firewall setup script
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/setup-vanessa-tailscale.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }
          $scriptText = Get-Content -LiteralPath $scriptPath -Raw
          foreach ($required in @('-LocalAddress $tailscaleIpText', '-RemoteAddress $peerRange', '$peerRange = "100.64.0.0/10"', '[switch] $Remove')) {
            if (-not $scriptText.Contains($required)) {
              throw "Firewall setup script is missing required safety guard: $required"
            }
          }
          Write-Host "Tailscale firewall script parses and retains its address/peer-range/removal guards."

      - name: Launch orchestrator, voice agent and built Electron renderer with local fixtures
        shell: pwsh
        run: |
          # No provider credentials, real model download, microphone or task.
          node scripts/desktop-runtime-fixtures.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test launcher, desktop layout, microphone, and provider contracts
        shell: pwsh
        run: |
          pnpm run test:launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test:doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test:desktop:layout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test:desktop:cancellation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test:desktop:microphone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test:desktop:conversation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test:desktop:history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @vanessa/orchestrator exec tsx --test ../../apps/desktop/src/main/remotePcIdentityStore.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @vanessa/orchestrator exec tsx --test ../../apps/desktop/src/main/runtimeConfig.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @vanessa/orchestrator exec tsx --test src/tests/fileAgent.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build the supported sanitized Windows setup EXE
        shell: pwsh
        run: |
          pnpm run package:windows-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and uninstall smoke test
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -InstallerPath 'artifacts/windows-installer/Vanessa-Setup-x64.exe'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vanessa-Windows-Installer-${{ github.event.pull_request.number || github.ref_name }}
          path: artifacts/windows-installer/Vanessa-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          name: Vanessa ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/windows-installer/Vanessa-Setup-x64.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
