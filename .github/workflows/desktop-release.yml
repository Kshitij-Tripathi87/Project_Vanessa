name: Desktop Windows Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after building and testing the Windows installer
        type: boolean
        default: false
        required: true
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'pull_request' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python for bootstrap packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build

      - name: Launch orchestrator, voice agent and Electron renderer together
        shell: pwsh
        env:
          VANESSA_PORT: "4319"
          VOICE_AGENT_PORT: "4500"
          PLANNER_PROVIDER: sarvam
          SARVAM_CHAT_PROVIDER: sarvam
          SARVAM_API_KEY: test-sarvam-key
          SARVAM_CHAT_MODEL: sarvam-105b-conversations
          VOICE_ASR_PROVIDER: fish
          VOICE_TTS_PROVIDER: fish
          FISH_API_KEY: sk-fish-sandbox-key
          FISH_TTS_VOICE_ID: vanessa-sandbox-voice
          FISH_ASR_MODEL: transcribe-stream-1
          FISH_TTS_MODEL: s2.1-pro-free
          VOICE_ALLOW_FALLBACK: "false"
          VOICE_TTS_FALLBACK_PROVIDER: none
          VOICE_STRICT_CONFIG: "true"
          VANESSA_RUNTIME_SMOKE_DEBUG_PORT: "9222"
        run: |
          $env:VANESSA_CONFIG_HOME = Join-Path $env:RUNNER_TEMP 'Vanessa-Runtime-Smoke'
          $env:VANESSA_WORKSPACE_ROOT = $env:GITHUB_WORKSPACE
          node scripts/launch-vanessa.cjs --dev --runtime-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test launcher, desktop layout, microphone, and provider contracts
        shell: pwsh
        run: |
          pnpm run test:launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test:doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test:desktop:layout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test:desktop:microphone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @vanessa/orchestrator exec tsx --test ../../apps/desktop/src/main/remotePcIdentityStore.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @vanessa/orchestrator exec tsx --test ../../apps/desktop/src/main/runtimeConfig.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build the supported sanitized Windows setup EXE
        shell: pwsh
        run: |
          pnpm run package:windows-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and uninstall smoke test
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -InstallerPath 'artifacts/windows-installer/Vanessa-Setup-x64.exe'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vanessa-Windows-Installer-${{ github.event.pull_request.number || github.ref_name }}
          path: artifacts/windows-installer/Vanessa-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          name: Vanessa ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/windows-installer/Vanessa-Setup-x64.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
