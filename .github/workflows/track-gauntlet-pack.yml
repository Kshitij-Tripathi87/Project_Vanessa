name: Track Vanessa Gauntlet pack sources

on:
  push:
    branches:
      - feat/vanessa-gauntlet-l1
    paths:
      - .github/workflows/track-gauntlet-pack.yml

permissions:
  contents: write

jobs:
  track-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vanessa-gauntlet-l1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Force-track the ignored benchmark pack
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc evals/vanessa-gauntlet/artifacts/Vanessa_Gauntlet_L1.patch.gz > /tmp/Vanessa_Gauntlet_L1.patch
          git apply --check --include='evals/vanessa-gauntlet/packs/**' /tmp/Vanessa_Gauntlet_L1.patch
          git apply --include='evals/vanessa-gauntlet/packs/**' /tmp/Vanessa_Gauntlet_L1.patch
          test -f evals/vanessa-gauntlet/packs/build/l1-expense-app/judge.mjs
          test -f evals/vanessa-gauntlet/packs/build/l1-expense-app/pack.json
          node --check evals/vanessa-gauntlet/packs/build/l1-expense-app/judge.mjs
          node --test evals/vanessa-gauntlet/tests/*.test.mjs
          git add -f evals/vanessa-gauntlet/packs
          rm .github/workflows/track-gauntlet-pack.yml
          git add -u .github/workflows/track-gauntlet-pack.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat(eval): track ignored Vanessa Gauntlet task pack sources"
          git push origin HEAD:feat/vanessa-gauntlet-l1
