name: Android UI QA (emulator)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ui-qa.yml'
  pull_request:
    branches:
      - main
      - feat/remote-v2-authenticated-gateway
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ui-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-journeys:
    name: Android emulator user journeys
    # GitHub-hosted Ubuntu runners expose /dev/kvm, which the emulator action can
    # use once the KVM udev rule below is applied. The previous macOS runner never
    # booted the API 35 arm64 AVD (every run failed with "Timeout waiting for
    # emulator to boot"), so the UI journeys never actually executed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      # The runner user is not in the "kvm" group, so /dev/kvm is root:kvm 0660
      # and the emulator would fall back to unaccelerated software emulation.
      - name: Enable KVM group permissions
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not present on this runner; hardware acceleration is unavailable."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Install Android test platform
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'
          # The runner needs an emulator binary and the image before it can create
          # an AVD. Both are installed here so a missing package fails loudly in a
          # step we control rather than inside the action, where the log is the
          # only evidence and it is not always retrievable.
          emulator -version | head -1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator is booted here rather than by android-emulator-runner. The
      # action is good, but when it fails its reason lives only in the step log,
      # and step logs are served from blob storage that is not always reachable.
      # Owning the boot means every decisive fact — acceleration, disk, AVD
      # config, the emulator's own stderr — is emitted as an annotation on the
      # run page, which stays readable when the log does not.
      - name: Check emulator acceleration and disk
        run: |
          emulator -accel-check || true
          df -h / /home /dev/shm || true
          accel=$(emulator -accel-check 2>&1 | tr '\n' ' ')
          free=$(df -h --output=avail /home | tail -1 | tr -d ' ')
          echo "::warning::acceleration: ${accel} | free on /home: ${free}"

      - name: Create AVD
        run: |
          if ! echo "no" | avdmanager create avd \
              -n vanessa \
              -k 'system-images;android-35;google_apis;x86_64' \
              -d pixel_2 \
              --force; then
            echo "::error::avdmanager could not create the AVD; the system image is missing or avdmanager is not on PATH."
            ls "$ANDROID_HOME/cmdline-tools" || true
            exit 1
          fi
          avdmanager list avd || true

      - name: Boot the emulator
        run: |
          mkdir -p /tmp/emu
          emulator -avd vanessa \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            > /tmp/emu/emulator.log 2>&1 &
          echo $! > /tmp/emu/pid
          echo "emulator pid $(cat /tmp/emu/pid)"
          # A process that dies in its first seconds is faster to read than a
          # ten-minute wait-for-device that is doomed anyway.
          sleep 20
          if ! kill -0 "$(cat /tmp/emu/pid)" 2>/dev/null; then
            echo "::error::the emulator process exited within 20s of starting"
            tail -c 3000 /tmp/emu/emulator.log | tr '\n' '~'
            exit 1
          fi
          if ! timeout 420 adb wait-for-device; then
            echo "::error::adb never saw a device"
            adb devices || true
            tail -c 3000 /tmp/emu/emulator.log | tr '\n' '~'
            exit 1
          fi
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "::warning::emulator booted after ~$((i * 5))s of polling"
              adb devices
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/emu/pid)" 2>/dev/null; then
              echo "::error::the emulator died while booting"
              tail -c 3000 /tmp/emu/emulator.log | tr '\n' '~'
              exit 1
            fi
            sleep 5
          done
          echo "::error::sys.boot_completed never became 1 within 600s"
          tail -c 3000 /tmp/emu/emulator.log | tr '\n' '~'
          exit 1

      - name: Run UI journeys
        run: |
          cd apps/android
          ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tail -n 200

      - name: Upload Android UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanessa-android-emulator-ui-test-reports
          path: |
            apps/android/app/build/reports/androidTests/connected/**
            apps/android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

      # A release gate that accepts an empty report is not a gate. This fails the
      # job when the XML exists but contains no executed testcase, which is the
      # state this job has been in since #62.
      - name: Require at least one executed instrumented test
        if: always()
        run: |
          results="apps/android/app/build/outputs/androidTest-results/connected"
          if [ ! -d "$results" ]; then
            echo "::error::No connected test results directory. The emulator runner never reached instrumentation."
            exit 1
          fi
          execs=$(grep -rho '<testcase' "$results" 2>/dev/null | wc -l | tr -d ' ')
          echo "Executed testcase elements: $execs"
          if [ "$execs" -eq 0 ]; then
            echo "::error::Zero instrumented tests executed. A green run with no executed tests is not evidence; failing the job instead of caching silently."
            exit 1
          fi
