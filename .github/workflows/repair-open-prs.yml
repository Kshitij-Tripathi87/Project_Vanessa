name: Repair and integrate open Vanessa PRs # [integrate-open-prs]
# The integration patch is tested against the target branch before any push; do not bypass build gates.
on:
  push:
    branches: [Vanessa-Prototype-1-MAIN]
permissions:
  contents: write
concurrency:
  group: repair-open-prs
  cancel-in-progress: false
jobs:
  integrate:
    if: contains(github.event.head_commit.message, '[integrate-open-prs]')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          ref: Vanessa-Prototype-1-MAIN
          fetch-depth: 0
          persist-credentials: true
      - name: Configure git identity and fetch existing PR branches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin +refs/heads/*:refs/remotes/origin/*
          git checkout --force -B Vanessa-Prototype-1-MAIN origin/Vanessa-Prototype-1-MAIN
      - name: Merge descendant PR branches and resolve intentional delete/modify conflicts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetSnapshot = (git rev-parse HEAD).Trim()

          function Invoke-FeatureMerge([string]$Source, [string]$Message) {
            Write-Host "[MERGE] $Source"
            git merge --no-edit --no-ff -X ours "origin/$Source" -m $Message
            if ($LASTEXITCODE -eq 0) { return }

            $conflicts = @(git diff --name-only --diff-filter=U)
            Write-Host "::warning::Resolving known delete/modify conflicts for $Source"
            foreach ($path in $conflicts) {
              switch ($path) {
                'apps/desktop/forge.config.ts' {
                  # Current target intentionally uses the checked Setup/MSI scripts,
                  # not the stale Forge maker configuration from the feature branch.
                  git rm -f -- $path
                }
                'services/orchestrator/src/agents/browser-playwright.agent.ts' {
                  # Keep the feature's implementation because its updated BrowserAgent imports it.
                  git checkout --theirs -- $path
                  git add -- $path
                }
                'services/voice-agent/src/session/porcupineWakeWord.ts' {
                  # The target uses local Whisper transcript standby and does not require a
                  # Picovoice .ppn file/API key to enable the default local wake-word profile.
                  git rm -f -- $path
                }
                default {
                  # For any unexpected conflict, preserve the target tree; do not guess.
                  git checkout $targetSnapshot -- $path
                  git add -- $path
                }
              }
              if ($LASTEXITCODE -ne 0) { throw "Could not resolve conflict for $path." }
            }
            $remaining = @(git diff --name-only --diff-filter=U)
            if ($remaining.Count -gt 0) { throw "Unresolved merge conflicts remain: $($remaining -join ', ')" }
            git commit --no-edit
            if ($LASTEXITCODE -ne 0) { throw "Could not finish merge commit for $Source." }
          }

          Invoke-FeatureMerge 'feat/issue-18-browser-folder-handoff' 'merge: integrate browser launch and operation-first handoff (#19, #38)'
          Invoke-FeatureMerge 'feat/windows-ui-automation-agent' 'merge: integrate safe Windows UI Automation (#23, #37)'

          # Keep the verified target's local-first voice configuration/implementation.
          # These PR branches were cut from an older Porcupine default and must not replace
          # the current local Whisper wake-word pipeline.
          $preserve = @(
            '.env.example',
            # Keep the current compact orb app shell. The stacked PR's older App.tsx
            # expects a Porcupine-era audio API and a full legacy dashboard layout.
            'apps/desktop/src/renderer/App.tsx',
            'apps/desktop/src/renderer/hooks/useAudioCapture.ts',
            'services/voice-agent/src/server.ts',
            'services/voice-agent/src/session/voiceSession.ts',
            'services/voice-agent/src/session/wakeWord.ts',
            'services/voice-agent/src/tests/wakeWord.test.ts'
          )
          foreach ($path in $preserve) {
            git cat-file -e "$($targetSnapshot):$path" 2>$null
            if ($LASTEXITCODE -eq 0) {
              git restore --source $targetSnapshot --staged --worktree -- $path
              if ($LASTEXITCODE -ne 0) { throw "Could not preserve target voice implementation for $path." }
            }
          }
          # Type-only compatibility for the retained ChatPanel component added by the
          # Control Deck PR. Runtime wake-word state remains the target's local Whisper contract.
          $hookPath = 'apps/desktop/src/renderer/hooks/useAudioCapture.ts'
          $hookContent = Get-Content -Raw -LiteralPath $hookPath
          if (-not $hookContent.Contains('export interface WakeWordStatus')) {
            $voiceStatusAnchor = 'export interface VoiceProviderStatus {'
            $wakeStatusLines = @(
              'export interface WakeWordStatus {'
              '  available: boolean;'
              '  ready: boolean;'
              '  listening: boolean;'
              '  keyword: string;'
              '  reason?: string;'
              '  state?: string;'
              '}'
              ''
              'export interface VoiceProviderStatus {'
            )
            $wakeStatusType = ($wakeStatusLines -join "`n") + "`n"
            if (-not $hookContent.Contains($voiceStatusAnchor)) { throw "Cannot locate VoiceProviderStatus anchor for compatibility type." }
            $hookContent = $hookContent.Replace($voiceStatusAnchor, $wakeStatusType)
            Set-Content -LiteralPath $hookPath -Value $hookContent -NoNewline -Encoding utf8
            git add -- $hookPath
            if ($LASTEXITCODE -ne 0) { throw "Could not stage wake-word type compatibility." }
          }
          # Reconcile files whose implementations/tests were written against different branch APIs.
          # Keep the current target Windows agent and planner; reuse the new deterministic route helpers
          # and the BrowserAgent plus unit tests from the same tested feature branch.
          git restore --source $targetSnapshot --staged --worktree -- services/orchestrator/src/agents/windows.agent.ts services/orchestrator/src/core/planner.ts
          if ($LASTEXITCODE -ne 0) { throw "Could not restore target Windows agent/planner contracts." }

          $featureFiles = @(
            @{ Source = 'feat/issue-18-browser-folder-handoff'; Path = 'services/orchestrator/src/agents/browser.agent.ts' },
            @{ Source = 'feat/issue-18-browser-folder-handoff'; Path = 'services/orchestrator/src/agents/browser-playwright.agent.ts' },
            @{ Source = 'feat/issue-18-browser-folder-handoff'; Path = 'services/orchestrator/src/tests/browserAgent.unit.test.ts' },
            @{ Source = 'feat/windows-ui-automation-agent'; Path = 'services/orchestrator/src/core/agentRouting.ts' },
            @{ Source = 'feat/windows-ui-automation-agent'; Path = 'services/orchestrator/src/tests/agentRouting.test.ts' },
            @{ Source = 'feat/windows-ui-automation-agent'; Path = 'services/orchestrator/src/tests/planner.browser.test.ts' },
            @{ Source = 'feat/windows-ui-automation-agent'; Path = 'services/orchestrator/src/agents/windows-ui-automation.ts' },
            @{ Source = 'feat/windows-ui-automation-agent'; Path = 'services/orchestrator/src/tests/windowsUiAutomation.test.ts' }
          )
          foreach ($entry in $featureFiles) {
            git restore --source "origin/$($entry.Source)" --staged --worktree -- $entry.Path
            if ($LASTEXITCODE -ne 0) { throw "Could not restore coherent feature file $($entry.Path) from $($entry.Source)." }
          }

          # This older test assumes a different WindowsAgent constructor and mocks its removed
          # runPowerShell surface. The current target agent injects typed WindowsAudio/WindowsControl
          # contracts; keep the dedicated UI Automation module tests instead.
          if (Test-Path -LiteralPath 'services/orchestrator/src/tests/windowsAgent.unit.test.ts') {
            git rm -f -- services/orchestrator/src/tests/windowsAgent.unit.test.ts
            if ($LASTEXITCODE -ne 0) { throw "Could not remove incompatible legacy WindowsAgent test." }
          }
          git add -- services/orchestrator/src/agents/browser.agent.ts services/orchestrator/src/agents/browser-playwright.agent.ts services/orchestrator/src/tests/browserAgent.unit.test.ts services/orchestrator/src/core/agentRouting.ts services/orchestrator/src/tests/agentRouting.test.ts services/orchestrator/src/tests/planner.browser.test.ts services/orchestrator/src/agents/windows-ui-automation.ts services/orchestrator/src/tests/windowsUiAutomation.test.ts

          # The source branch also carried an obsolete Porcupine-only test in a separate
          # test directory. Current wake-word coverage lives beside the local Whisper detector.
          if (Test-Path -LiteralPath 'services/voice-agent/src/tests/wakeWord.test.ts') {
            git rm -f -- services/voice-agent/src/tests/wakeWord.test.ts
            if ($LASTEXITCODE -ne 0) { throw "Could not remove obsolete Porcupine-only test." }
          }
          # The integration helper normalizes Windows checkout newlines and keeps renderer typings compatible.
          node scripts/repair-pr-integration.cjs $targetSnapshot
          if ($LASTEXITCODE -ne 0) { throw "Compatibility integration patch failed." }

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix(integration): align stacked PRs with current voice and desktop contracts"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit local voice preservation." }
          }

          foreach ($branch in @(
            'feat/issue-18-browser-folder-handoff',
            'feat/agent-routing-folder-browser-ci',
            'feat/windows-ui-automation-agent',
            'main'
          )) {
            git merge-base --is-ancestor "origin/$branch" HEAD
            if ($LASTEXITCODE -ne 0) { throw "Expected ancestry missing after integration: $branch" }
          }
          Write-Host "[OK] Integrated candidate: $(git rev-parse HEAD)"
          git status --short
      - name: Set up Node.js and Python
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Refresh lockfile for Playwright browser automation
        shell: pwsh
        run: |
          pnpm install --lockfile-only
          if ($LASTEXITCODE -ne 0) { throw "Could not refresh the lockfile for the declared Playwright dependency." }
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build every workspace package
        run: pnpm build
      - name: Test agent routing and UI automation regressions
        shell: pwsh
        run: |
          pnpm --filter @vanessa/orchestrator exec tsx --test src/tests/agentCatalog.test.ts src/tests/agentRouting.test.ts src/tests/browserAgent.unit.test.ts src/tests/fileAgent.test.ts src/tests/folderAgent.test.ts src/tests/planner.browser.test.ts src/tests/taskRunner.result.test.ts src/tests/windowsUiAutomation.test.ts src/tests/windowsAgentUiAutomation.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Agent routing/UI Automation tests failed." }
          pnpm --filter @vanessa/orchestrator test:trustworthy-execution
          if ($LASTEXITCODE -ne 0) { throw "Trustworthy-execution tests failed." }
          pnpm --filter @vanessa/desktop test:docking
          if ($LASTEXITCODE -ne 0) { throw "Desktop docking tests failed." }
      - name: Test voice, launcher, and microphone contracts
        shell: pwsh
        run: |
          pnpm run test:sarvam:gate
          if ($LASTEXITCODE -ne 0) { throw "Voice/provider regression gate failed." }
          pnpm run test:doctor
          if ($LASTEXITCODE -ne 0) { throw "Launcher diagnostics tests failed." }
          pnpm run test:desktop:layout
          if ($LASTEXITCODE -ne 0) { throw "Desktop layout tests failed." }
          pnpm run test:desktop:microphone
          if ($LASTEXITCODE -ne 0) { throw "Microphone diagnostics tests failed." }
          node --test scripts/security.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Security regression tests failed." }
      - name: Test orchestrator scenarios, skills, and failure drills
        shell: pwsh
        run: |
          pnpm run test:scenarios
          if ($LASTEXITCODE -ne 0) { throw "Scenario regression suite failed." }
          pnpm run test:skills
          if ($LASTEXITCODE -ne 0) { throw "Skills regression suite failed." }
          pnpm run test:drills
          if ($LASTEXITCODE -ne 0) { throw "Failure drills failed." }
          pnpm run test:drills:process
          if ($LASTEXITCODE -ne 0) { throw "Process failure drills failed." }
      - name: Push only after all integration checks pass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Verified integration commit: $(git rev-parse HEAD)"
          git log -5 --oneline
          git push origin HEAD:refs/heads/Vanessa-Prototype-1-MAIN
